<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>A Flow — Menaxhimi Financiar</title>
    <meta name="description" content="App moderne për menaxhimin e financave, faturave dhe shpenzimeve" />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#f9fafb" />
    <!-- Tema para ngarkimit: ngjyra e shiritit të sipërm dhe klasa .dark vendosen para se të shfaqet faqja -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem('arestv_dark') === 'true';
          if (dark) document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#10141a' : '#f9fafb');
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="A Flow" />

    <!-- Icons -->
    <link rel="icon" href="/aflow-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/pwa_icon_192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
